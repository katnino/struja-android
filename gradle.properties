# Project-wide Gradle settings.
# IDE (e.g., Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.configuration-cache=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Compose
android.useAndroidX=true
android.enableJetifier=true

# 16KB page size compatibility (required for Android 15 / SDK 35)
android.config.maxPageSize=16384

# Compose compiler reports
android.experimental.r8.r8-class-merge=true

# Use Java 21 for Gradle daemon (compatible with Gradle 8.12.1)
org.gradle.java.home=/Library/Java/JavaVirtualMachines/openjdk-21.jdk/Contents/Home
